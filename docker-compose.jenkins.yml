# Lab7: Jenkins in Docker (+ доступ к Docker socket для agent-контейнеров)
# Запуск: docker compose -f docker-compose.jenkins.yml up -d --build
#
# UI: http://127.0.0.1:8080  (login admin / admin)
# Workspace проекта монтируется в /workspace

services:
  jenkins:
    build:
      context: ./ci/jenkins
      dockerfile: Dockerfile
    container_name: openbmc-jenkins
    # host network: Jenkins и агенты видят QEMU на 127.0.0.1:2443
    network_mode: host
    user: root
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./ci/jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro
      - ./:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
